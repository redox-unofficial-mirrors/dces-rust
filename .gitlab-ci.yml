test:
  stage: test
  image: rust:latest
  dependencies:
    - build_linux
  only:
    - main
    - develop

  script:
    - cargo test

  artifacts:
    #paths:
    #  - "$dces_guide_root/$language"
    expire_in: 1 weeks
